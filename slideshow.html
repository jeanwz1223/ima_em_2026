<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Slideshow</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: white;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slideshow {
            width: 33.33vw;
            height: 33.33vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .slide {
            position: absolute;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            opacity: 0;
        }

        .slide.active {
            opacity: 1;
        }

        .fade-out {
            animation: fadeOut 1.2s ease forwards;
        }

        .fade-in {
            animation: fadeIn 1.2s ease forwards;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="slideshow">
        <img src="img-example/aa.jpg" class="slide active">
        <img src="img-example/bb.jpg" class="slide">
        <img src="img-example/cc.jpg" class="slide">
        <img src="img-example/dd.jpg" class="slide">
        <img src="img-example/ee.jpg" class="slide">
        <img src="img-example/ff.jpg" class="slide">
    </div>

    <script>
        const slides = document.querySelectorAll(".slide");

        let current = 0;

        function nextSlide() {
            const currentSlide = slides[current];

            currentSlide.classList.remove("active");
            currentSlide.classList.add("fade-out");

            setTimeout(() => {
                currentSlide.classList.remove("fade-out");

                current = (current + 1) % slides.length;

                const nextSlide = slides[current];

                nextSlide.classList.add("fade-in");

                setTimeout(() => {
                    nextSlide.classList.remove("fade-in");
                    nextSlide.classList.add("active");
                }, 1200);

            }, 1200);
        }

        setInterval(nextSlide, 4000);
    </script>

</body>
</html>
