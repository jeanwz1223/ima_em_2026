<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .circle {
    width: min(33vw, 420px);
    height: min(33vw, 420px);

    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 14px;

    position: relative;
    top: -40px;
    transform: scale(0.85);
}

        .piece {
            width: 100%;
            height: 100%;
        }

        .top-left {
            background: #D1F6ED;
            border-radius: 100% 0 0 0;
        }

        .top-right {
            background: #F8E3F8;
            border-radius: 0 100% 0 0;
        }

        .bottom-left {
            background: #E1F3FE;
            border-radius: 0 0 0 100%;
        }

        .bottom-right {
            background: #FFE9E0;
            border-radius: 0 0 100% 0;
        }
    </style>
</head>

<body>

    <div class="circle">
        <div class="piece top-left"></div>
        <div class="piece top-right"></div>
        <div class="piece bottom-left"></div>
        <div class="piece bottom-right"></div>
    </div>

</body>
</html>
